name: Publish scheduled NFV articles

on:
  schedule:
    # Every Saturday at 9:00 AM UAE time
    - cron: '0 5 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfv-saturday-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: website
          token: ${{ secrets.NFV_PUBLISH_TOKEN }}
          persist-credentials: true

      - name: Checkout private unpublished articles
        uses: actions/checkout@v4
        with:
          repository: noelfvillaluz/nfv-unpublished-articles
          ref: main
          path: unpublished
          token: ${{ secrets.NFV_PUBLISH_TOKEN }}
          persist-credentials: false

      - name: Publish all articles due
        shell: bash
        run: |
          python3 website/scripts/publish_articles.py \
            --site website \
            --staging unpublished

      - name: Commit published pages to main
        working-directory: website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            git commit -m "Publish scheduled NFV technical articles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
